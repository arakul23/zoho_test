version: '3.8'

services:
    php:
        container_name: zoho_php-fpm
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        environment:
            DB_HOST: mysql
            DB_PASSWORD: root
        volumes:
            - .:/var/www/html
        depends_on:
            mysql:
                condition: service_healthy
        restart: unless-stopped
        user: "1000:1000"
        healthcheck:
            test: ["CMD", "php-fpm", "-t"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        command: >
            sh -c "
            php artisan wayfinder:generate --with-form &&
            php-fpm
            "

    node:
        build:
            context: .
            dockerfile: docker/node/Dockerfile
        container_name: zoho_node
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            - /var/www/html/node_modules
        ports:
            - "5173:5173"
        tty: true
        user: "root"
        environment:
            - NODE_ENV=development
            - CHOKIDAR_USEPOLLING=true
        depends_on:
            php:
                condition: service_healthy
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        restart: unless-stopped

    nginx:
        image: nginx:1.25
        ports:
            - "8083:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php

    mysql:
        container_name: zoho_mysql
        image: mysql:8.4
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: zoho
            MYSQL_ROOT_PASSWORD: root
        healthcheck:
            test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent" ]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 10s
        volumes:
            - mysql_data:/var/lib/mysql

    redis:
        image: redis:7-alpine
        container_name: zoho_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        command: >
            redis-server
            --requirepass ${REDIS_PASSWORD:-secret}
            --appendonly yes
        volumes:
            - redis_data:/data

volumes:
    mysql_data:
    redis_data:
    node_modules:

networks:
    app-network:
        driver: bridge
