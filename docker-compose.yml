services:
    php:
        container_name: zoho_php-fpm
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        environment:
            DB_HOST: mysql
            DB_PASSWORD: root
        volumes:
            - .:/var/www/html
        depends_on:
            mysql:
                condition: service_healthy
        restart: unless-stopped
        user: "1000:1000"

    nginx:
        image: nginx:1.25
        ports:
            - "8083:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php

    mysql:
        container_name: zoho_mysql
        image: mysql:8.4
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: zoho
            MYSQL_ROOT_PASSWORD: root
        healthcheck:
            test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent" ]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 10s
        volumes:
            - mysql_data:/var/lib/mysql

    redis:
        image: redis:7-alpine
        container_name: zoho_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        command: >
            redis-server
            --requirepass ${REDIS_PASSWORD:-secret}
            --appendonly yes
        volumes:
            - redis_data:/data
        healthcheck:
            test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    mysql_data:
    redis_data:
        driver: local

networks:
    app-network:
        driver: bridge

